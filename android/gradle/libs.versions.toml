# Exact versions only (see docs/android-plan.md: the Citadel lesson).
[versions]
agp = "8.10.1"
kotlin = "2.1.21"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
sshj = "0.41.2"
bouncycastle = "1.84"
annotation = "1.9.1"
core = "1.16.0"
yubikit = "3.1.0"  # 3.2+ needs compileSdk 37
biometric = "1.1.0"
# biometric 1.1.0 brings Fragment 1.2.5, whose registerForActivityResult is broken (lint error).
fragment = "1.8.6"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
orgjson = { group = "org.json", name = "json", version = "20250517" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }

bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
yubikit-android = { group = "com.yubico.yubikit", name = "android", version.ref = "yubikit" }
yubikit-fido = { group = "com.yubico.yubikit", name = "fido", version.ref = "yubikit" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
