name: SmartTerminalPad
options:
  bundleIdPrefix: com.pluginslab
  deploymentTarget:
    iOS: "26.0"
packages:
  SmartTerminal:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
targets:
  SmartTerminalPad:
    type: application
    platform: iOS
    sources: [SmartTerminalPad]
    info:
      path: SmartTerminalPad/Info.plist
      properties:
        UIAppFonts: [FiraCodeNerdFontMono-Regular.ttf, FiraCodeNerdFontMono-Bold.ttf]
        NSMicrophoneUsageDescription: "Smart Terminal records your voice while you dictate and sends it to the Whisper server in your host's Glossa config."
        NSLocalNetworkUsageDescription: "Smart Terminal connects to your hosts over SSH."
        # The Whisper endpoint in the host's Glossa config is plain HTTP on the tailnet
        # or LAN (llm-router on supermaschine); ATS would refuse it otherwise.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: SmartTerminal
        product: SmartTerminalCore
      - package: SwiftTerm
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluginslab.smartterminal.pad
        PRODUCT_NAME: Smart Terminal
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: SmartTerminalPad/SmartTerminalPad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Smart Terminal connects to your hosts over SSH."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Smart Terminal can unlock with Face ID."
        DEVELOPMENT_TEAM: MUDZ38WC7Q
        CODE_SIGN_STYLE: Automatic
