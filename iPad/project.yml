name: SmartTerminalPad
options:
  bundleIdPrefix: com.pluginslab
  deploymentTarget:
    iOS: "26.0"
packages:
  SmartTerminal:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
targets:
  SmartTerminalPad:
    type: application
    platform: iOS
    sources: [SmartTerminalPad]
    info:
      path: SmartTerminalPad/Info.plist
      properties:
        UIAppFonts: [FiraCodeNerdFontMono-Regular.ttf, FiraCodeNerdFontMono-Bold.ttf]
    dependencies:
      - package: SmartTerminal
        product: SmartTerminalCore
      - package: SwiftTerm
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluginslab.smartterminal.pad
        PRODUCT_NAME: Smart Terminal
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Smart Terminal connects to your hosts over SSH."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_TEAM: MUDZ38WC7Q
        CODE_SIGN_STYLE: Automatic
