name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (macOS 26)
    # The package targets macOS 26 and needs the macOS 26 SDK / Swift 6.2.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Core tests
        run: swift test

      - name: Build the app (debug and release)
        run: |
          swift build
          swift build -c release

      # Everything the app signs, ships or tests must run without the maintainer's machine.
      - name: Bundle (ad-hoc signed) and verify
        run: |
          SMART_TERMINAL_SIGN_IDENTITY=- scripts/bundle.sh
          codesign --verify --verbose SmartTerminal.app
          plutil -lint SmartTerminal.app/Contents/Info.plist
